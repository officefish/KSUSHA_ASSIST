# Yarn 4 конфигурация монорепо Kubiki (стек унаследован от Membrana).

# Плоский node_modules — совместим с Vite, TypeScript project references и ESLint
# без дополнительной настройки (в отличие от PnP).
nodeLinker: node-modules

# На Windows симлинки требуют Developer Mode; junction-ссылки работают без привилегий.
winLinkType: junctions

# Глобальный кеш — экономит трафик и место между проектами.
enableGlobalCache: true

enableStrictSsl: true
enableProgressBars: true

# На CI установка идёт с --immutable явно.
enableImmutableInstalls: false
